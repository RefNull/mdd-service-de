models:
  # Default 0.6B fluency model
  qwen3-asr:
    cmd: python asr_server.py --port ${PORT} --model Qwen3-ASR-0.6B
    ttl: 3600
    healthCheckTimeout: 120
    checkEndpoint: /health

  # Higher-capacity 1.7B fluency model
  qwen3-asr-1.7b:
    cmd: python asr_server.py --port ${PORT} --model Qwen3-ASR-1.7B
    ttl: 3600
    healthCheckTimeout: 180
    checkEndpoint: /health

  # Pronunciation assessment microservice
  openpronounce:
    cmd: python pronounce_server.py --port ${PORT}
    ttl: 3600
    healthCheckTimeout: 180
    checkEndpoint: /health

# Group definition to allow concurrent execution without mutual eviction.
# By default, llama-swap unloads the previous model when a new one is requested.
# Setting swap: false ensures qwen3-asr and openpronounce stay loaded in VRAM
# simultaneously throughout the 2-step assessment flow, avoiding reload latency.
groups:
  pipeline:
    swap: false
    members:
      - qwen3-asr
      - qwen3-asr-1.7b
      - openpronounce

